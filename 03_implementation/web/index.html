<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060a08" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="PlantPal+ — plant care, fitness and nutrition in one beautifully simple daily ritual. Watering that follows the season, workouts and meals that add up, one streak for all three."
    />
    <meta property="og:title" content="PlantPal+ — one ritual for your plants, workouts and meals" />
    <meta
      property="og:description"
      content="Plant care, fitness and nutrition tracked in one place, on one streak."
    />
    <meta property="og:type" content="website" />
    <title>PlantPal+</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2314734b'/%3E%3Cstop offset='1' stop-color='%23073b26'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 50V31' stroke='%23e9f7ef' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='M32 33c0-8-5.5-13.5-13.5-13.5 0 8 5.5 13.5 13.5 13.5Z' fill='%23e9f7ef'/%3E%3Cpath d='M32 27c0-7 4.6-12.4 12.6-12.4 0 7-4.6 12.4-12.6 12.4Z' fill='%23e6bd6a'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the stored (or system) theme before first paint so dark-mode
      // reloads and the auth pages never flash light. Keys index.css tokens.
      try {
        var t = localStorage.getItem('plantpal-theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
