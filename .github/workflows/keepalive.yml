name: Keep API awake

# The live API runs on Supabase Edge Functions (06_deployment/README.md), which never
# sleeps — but a free Supabase project is paused after a week without
# activity, and a paused project takes the database (and so every sign-in) down
# with it until someone restores it by hand. That happened to this deployment.
#
# The pg_cron tick (06_deployment/schedule-tick.sql) already reaches the API every
# five minutes from inside the database. This is the outside-in second line:
# /readyz runs a real query, so a ping proves the API *and* the database are
# up, and a red run here is the first sign that the project has gone to sleep.
# Every six hours is plenty for the weekly pause window and costs nothing.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity; an external pinger such as UptimeRobot is sturdier if that
# matters.
#
# Uses the PLANTPAL_API_URL repository variable (Settings → Secrets and
# variables → Actions → Variables), the same one the Pages build uses:
# https://mmqqijfgtcjviogqporc.supabase.co/functions/v1/plantpal-api

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /readyz
        env:
          PLANTPAL_API_URL: ${{ vars.PLANTPAL_API_URL }}
        run: |
          if [ -z "$PLANTPAL_API_URL" ]; then
            echo "PLANTPAL_API_URL unset — skipping"
            exit 0
          fi
          url=$PLANTPAL_API_URL
          while [[ $url == */ ]]; do url=${url%/}; done
          # Retries cover a cold start; a project that is actually paused
          # fails all of them, and the red run is the alert.
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors "$url/readyz"
