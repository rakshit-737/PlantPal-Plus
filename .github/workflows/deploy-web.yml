name: Deploy web to GitHub Pages

# Publishes apps/web to GitHub Pages on every push to main.
#
# The site is served at https://<owner>.github.io/PlantPal-Plus/, so the build
# sets VITE_BASE to the repo subpath. GitHub Pages cannot rewrite /api/*, so
# the client calls the API origin directly: set the PLANTPAL_API_URL repository
# variable (Settings → Secrets and variables → Actions → Variables) to the
# deployed API origin, e.g. https://plantpal-api.onrender.com — and include the
# Pages origin in the API's CORS_ORIGINS. Until then the site deploys but
# sign-in fails with a network error.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @plantpal/shared

      - name: Build web
        env:
          VITE_BASE: /PlantPal-Plus/
          VITE_API_URL: ${{ vars.PLANTPAL_API_URL }}
        run: npm run build --workspace @plantpal/web

      # SPA fallback: Pages serves 404.html for unknown paths; a copy of
      # index.html lets BrowserRouter handle deep links like /plants.
      - name: SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
