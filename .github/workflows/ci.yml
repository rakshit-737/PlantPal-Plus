name: CI

# Every push to main and every pull request runs two jobs:
#   verify  strict TypeScript and the full test suite, including the
#           PostgreSQL integration suites, on the declared Node floor (20.11)
#           and the current LTS (22);
#   lint    ESLint across the whole monorepo.
# Prettier is not gated: .prettierrc.json records the house style, but parts of
# the codebase predate it and have not been reformatted.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels the in-flight run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test + typecheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.11 is the floor declared in package.json engines; 22 is current LTS.
        node: ['20.11', '22']
    services:
      # Real PostgreSQL for the auth integration suite (skipped when absent).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plantpal
          POSTGRES_PASSWORD: plantpal
          POSTGRES_DB: plantpal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plantpal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://plantpal:plantpal@localhost:5432/plantpal_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci needs a lockfile; fall back to install if one is not committed.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json found; using 'npm install'. Commit a lockfile for reproducible CI."
            npm install
          fi

      # dist/ is gitignored; the api, web and mobile workspaces resolve
      # @plantpal/shared through its built declarations, so build it first.
      - name: Build shared package
        run: npm run build --workspace @plantpal/shared

      - name: Typecheck (strict TypeScript, all workspaces)
        run: npm run typecheck

      - name: Test (all workspaces)
        run: npm test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ESLint 10 needs Node 20.19 or newer, above the 20.11 floor the matrix
      # tests, so lint runs once on the current LTS.
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
